name: Database CI

on:
  push:
    branches: [features/DBs]
  pull_request:
    branches: [features/DBs]

jobs:
  test_RDB:
    runs-on: ubuntu-latest
    steps:
      - name: check code
        uses: actions/checkout@v4

      - name: set python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd relational
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest -v