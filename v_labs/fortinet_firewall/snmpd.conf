# snmpd.conf — mimics Fortinet FortiGate Firewall
agentAddress  udp:161
rocommunity   public default

# ── System info ──────────────────────────────────────────────────────
# 1.3.6.1.4.1.12356 → Fortinet enterprise OID
sysObjectID   1.3.6.1.4.1.12356.101.1.200

sysDescr      FortiGate-200E v6.4.8,build1914,211015 (GA)
sysName       FortiGate-SIM
sysContact    admin@company.com
sysLocation   DataCenter-Rack-D1

# ── Interface table support ──────────────────────────────────────────
# Expose ifTable (IF-MIB) so dummy interfaces appear as real ports
view   systemview  included   .1.3.6.1.2.1.2

# ── Extended device info ─────────────────────────────────────────────
extend  .1.3.6.1.4.1.12356.101.1.1  model      echo "FortiGate-200E"
extend  .1.3.6.1.4.1.12356.101.1.2  serial     echo "SN-FGT200E-SIM-001"
extend  .1.3.6.1.4.1.12356.101.1.3  firmware   echo "v6.4.8,build1914"
extend  .1.3.6.1.4.1.12356.101.1.4  board      echo "FG-200E"
extend  .1.3.6.1.4.1.12356.101.1.5  portcount  echo "2"
extend  .1.3.6.1.4.1.12356.101.1.6  vendor     echo "Fortinet"