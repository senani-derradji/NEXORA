<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEXORA 3D Topology</title>

<style>

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#0a0f1a;
color:white;
overflow:hidden;
}

#ui{
position:absolute;
top:10px;
left:10px;
width:350px;
background:rgba(20,30,60,0.6);
backdrop-filter:blur(10px);
padding:20px;
border-radius:10px;
}

h1{
margin:0;
font-size:22px;
}

.small{
font-size:12px;
color:#aaa;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:10px;
}

.card{
background:rgba(255,255,255,0.05);
padding:10px;
border-radius:8px;
text-align:center;
}

.legend{
margin-top:15px;
font-size:13px;
line-height:1.6;
}

</style>
</head>

<body>

<div id="ui">

<h1>NEXORA</h1>
<div class="small">Network Observability</div>

<br>

<b>3D Topology</b><br>
Admin: Administrator<br>
Status: <span style="color:#00ff9c">System Online</span>

<br><br>

<div class="stats">

<div class="card">
<b id="devices">4</b><br>
Total Devices
</div>

<div class="card">
<b style="color:#0f0">3</b><br>
Online
</div>

<div class="card">
<b style="color:#f33">1</b><br>
Offline
</div>

<div class="card">
<b>128/s</b><br>
Data Flow
</div>

</div>

<div class="legend">

🔷 Core Server<br>
📡 Collector Server<br>
🗄 PostgreSQL / InfluxDB<br>
🖥 Online Device<br>
⚠ Offline Device<br>

SNMP (UDP 161)<br>
gRPC<br>
DB Write

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>

const scene = new THREE.Scene()

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
)

camera.position.set(0,4,10)

const renderer = new THREE.WebGLRenderer({antialias:true})
renderer.setSize(window.innerWidth,window.innerHeight)
document.body.appendChild(renderer.domElement)

const light = new THREE.PointLight(0xffffff,1)
light.position.set(5,10,10)
scene.add(light)

const ambient = new THREE.AmbientLight(0x404040)
scene.add(ambient)


function node(color,x,y,z){

const g = new THREE.SphereGeometry(0.5,32,32)
const m = new THREE.MeshStandardMaterial({
color:color,
emissive:color,
emissiveIntensity:0.6
})

const mesh = new THREE.Mesh(g,m)
mesh.position.set(x,y,z)

scene.add(mesh)

return mesh
}


const linux1 = node(0x00ff88,-4,0,0)
const linux2 = node(0x00ff88,-4,2,0)

const collector = node(0x00aaff,-1,1,0)

const core = node(0x0055ff,2,1,0)

const influx = node(0xffaa00,5,2,0)
const postgres = node(0xff6600,5,0,0)



function link(a,b,color){

const material = new THREE.LineBasicMaterial({color:color})

const points = []
points.push(a.position)
points.push(b.position)

const geometry = new THREE.BufferGeometry().setFromPoints(points)

const line = new THREE.Line(geometry,material)

scene.add(line)

return line
}


link(linux1,collector,0x00ff88)
link(linux2,collector,0x00ff88)

link(collector,core,0x00aaff)

link(core,influx,0xffaa00)
link(core,postgres,0xff6600)



function particleFlow(start,end,color){

const g = new THREE.SphereGeometry(0.1,8,8)
const m = new THREE.MeshBasicMaterial({color:color})

const p = new THREE.Mesh(g,m)

scene.add(p)

let t=0

function animate(){

t+=0.01

p.position.lerpVectors(start.position,end.position,t)

if(t>1){
t=0
}

requestAnimationFrame(animate)
}

animate()

}


particleFlow(linux1,collector,0x00ff88)
particleFlow(linux2,collector,0x00ff88)

particleFlow(collector,core,0x00aaff)

particleFlow(core,influx,0xffaa00)
particleFlow(core,postgres,0xff6600)



const grid = new THREE.GridHelper(20,20,0x444444,0x222222)
scene.add(grid)



function animate(){

requestAnimationFrame(animate)

scene.rotation.y += 0.002

renderer.render(scene,camera)

}

animate()


window.addEventListener("resize",()=>{

camera.aspect = window.innerWidth/window.innerHeight
camera.updateProjectionMatrix()

renderer.setSize(window.innerWidth,window.innerHeight)

})


</script>

</body>
</html>
