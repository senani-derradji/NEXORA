  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    profiles: [prod, vlab]

    ports:
      - "3000:8080"

    environment:
      - API_URL=http://backend:8000

    networks:
      my_shared_network:
        ipv4_address: 172.18.0.60

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  influxdb2-data:
    driver: local

networks:
  my_shared_network:
    name: my_shared_network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.18.0.0/24
          gateway: 172.18.0.1