services:

  v_lab_fortinet_firewall:
    build:
      context: ./v_labs/fortinet_firewall
      dockerfile: Dockerfile

    container_name: f_firewall
    restart: unless-stopped
    profiles: [vlab]
    expose: ["161/udp"]
    networks:
      my_shared_network:
        ipv4_address: 172.18.0.3
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 64m



  # v_lab_linux:
  #   build:
  #     context: ./v_labs/linux_
  #     dockerfile: Dockerfile

  #   container_name: linux
  #   restart: unless-stopped
  #   profiles: [vlab]
  #   expose: ["161/udp"]
  #   networks:
  #     my_shared_network:
  #       ipv4_address: 172.18.0.9
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "0.2"
  #         memory: 64m

  v_lab_switch:
    build:
      context: ./v_labs/micro_switch
      dockerfile: Dockerfile
    container_name: mikrotik-switch
    hostname: MikroTik-Switch-SIM
    restart: unless-stopped
    profiles: [vlab]
    privileged: true
    expose: ["161/udp"]
    volumes:
      - ./logs/mikrotik-switch:/var/log/nexora
    command: sh -c "/startup.sh 2>&1 | tee /var/log/nexora/switch.log"
    networks:
      my_shared_network:
        ipv4_address: 172.18.0.2
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128m

  v_lab_router:
    build:
      context: ./v_labs/micro_router
      dockerfile: Dockerfile
    container_name: mikrotik-router
    hostname: MikroTik-Router-SIM
    restart: unless-stopped
    profiles: [vlab]
    privileged: true
    expose: ["161/udp"]
    volumes:
      - ./logs/mikrotik-router:/var/log/nexora
    command: sh -c "/startup.sh 2>&1 | tee /var/log/nexora/router.log"
    networks:
      my_shared_network:
        ipv4_address: 172.18.0.9
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128m

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    profiles: [prod, vlab]

    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
      TZ: UTC
      PGTZ: UTC

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init_postgres.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./logs/postgres:/var/log/nexora

    command: sh -c "docker-entrypoint.sh postgres 2>&1 | tee /var/log/nexora/postgres.log"

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      my_shared_network:
        ipv4_address: 172.18.0.20

    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256m
        reservations:
          memory: 128m



  influxdb:
    image: influxdb:2
    container_name: influxdb
    restart: unless-stopped
    profiles: [prod, vlab]

    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME:       ${INFLUXDB_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD:   ${INFLUXDB_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_DB:               ${INFLUXDB_DB}
      DOCKER_INFLUXDB_INIT_ORG:              ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET:           ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_OPERATOR_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}

    ports:
      - "8086:8086"

    volumes:
      - ./logs/influxdb:/var/log/nexora

    command: sh -c "influxd 2>&1 | tee /var/log/nexora/influxdb.log"

    healthcheck:
      test: ["CMD-SHELL", "curl -f -H 'Authorization: Token ${INFLUXDB_INIT_ADMIN_TOKEN}' http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      my_shared_network:
        ipv4_address: 172.18.0.10

    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256m
        reservations:
          memory: 128m


  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: core
    restart: unless-stopped
    profiles: [prod, vlab]

    env_file:
      - ./core/configs/.env
      - ./core/time_series/config/.env

    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TZ: UTC

    volumes:
      - ./logs/core:/var/log/nexora

    command: sh -c "python ingester/ingest_service.py 2>&1 | tee /var/log/nexora/core.log"

    ports:
      - "50051:50051"

    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import grpc; ch=grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(ch).result(timeout=5)\" && echo ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

    networks:
      my_shared_network:
        ipv4_address: 172.18.0.30

    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: 256m
        reservations:
          memory: 128m


  collectors:
    build:
      context: ./collectors
      dockerfile: Dockerfile
    container_name: collectors
    restart: unless-stopped
    profiles: [prod, vlab]

    env_file:
      - ./collectors/config/db_config/.env

    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TZ: UTC

    volumes:
      - ./logs/collectors:/var/log/nexora
      - ./collectors/config/devices.yml:/collectors/config/devices.yml

    command: sh -c "/collectors/pre_start_check.sh && python /collectors/main.py 2>&1 | tee /var/log/nexora/collectors.log"

    depends_on:
      postgres:
        condition: service_healthy
      core:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python.*main.py' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      my_shared_network:
        ipv4_address: 172.18.0.40

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          memory: 128m




  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    profiles: [prod, vlab]

    env_file:
      - ./backend/.env

    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TZ: UTC

    volumes:
      - ./logs/backend:/var/log/nexora

    command: sh -c "uvicorn main:app --host 0.0.0.0 --port 8000 --reload --workers 1 2>&1 | tee /var/log/nexora/backend.log"

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      core:
        condition: service_healthy
      collectors:
        condition: service_started

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

    networks:
      my_shared_network:
        ipv4_address: 172.18.0.50

    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: 256m
        reservations:
          memory: 128m



  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    profiles: [prod, vlab]

    ports:
      - "3000:8080"

    environment:
      - API_URL=http://backend:8000

    volumes:
      - ./logs/frontend:/var/log/nginx

    networks:
      my_shared_network:
        ipv4_address: 172.18.0.60


volumes:
  postgres_data:
    driver: local

networks:
  my_shared_network:
    name: my_shared_network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.18.0.0/24
          gateway: 172.18.0.1